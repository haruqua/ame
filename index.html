<!doctype html>
<html lang="ja">

  <body
    id="top"
    class="sp-none">
    <header><div class="circle-header"></div></header>
    <main>
      <menu>
        <li class="menu1">
          <p>fairwater</p>
          <p>fairwater</p>

        </li>
        <li class="menu2">

      </menu>
    </main>
    <script>
      (function () {
        var DROPLET_COUNT = 20;
        for (var i = 0; i < DROPLET_COUNT; i++) {
          var droplet = document.createElement('div');
          droplet.classList.add('droplet');
          droplet.style.top = Math.random() * 100 + '%';
          droplet.style.left = Math.random() * 100 + '%';
          droplet.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
          document.body.appendChild(droplet);
        }
      })();
    </script>
  </body>
